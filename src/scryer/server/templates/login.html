{% extends "_base.html" %}
{% block title %}Login · scryer{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-12 p-6 bg-white border border-zinc-200 rounded">
  <h1 class="text-xl font-bold mb-4">Sign in to scryer</h1>
  {% if error %}
    <div class="mb-3 px-3 py-2 bg-red-50 text-red-700 text-sm rounded">{{ error }}</div>
  {% endif %}
  <form method="post" action="/web/login" class="space-y-3">
    <input name="email" type="email" required placeholder="email"
           class="w-full px-3 py-2 border border-zinc-300 rounded focus:outline-none focus:ring focus:ring-zinc-200" />
    <input name="password" type="password" required placeholder="password"
           class="w-full px-3 py-2 border border-zinc-300 rounded focus:outline-none focus:ring focus:ring-zinc-200" />
    <button class="w-full py-2 bg-zinc-900 text-white rounded hover:bg-zinc-700">
      Sign in
    </button>
  </form>
</div>
{% endblock %}
