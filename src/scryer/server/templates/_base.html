<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}scryer{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900">
  <header class="border-b border-zinc-200 bg-white">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/web/workspaces" class="font-bold text-lg">scryer</a>
      <nav class="text-sm text-zinc-500 flex gap-4">
        <a href="/api/openapi.json" class="hover:text-zinc-900">openapi</a>
        <a href="/api/docs" class="hover:text-zinc-900">api docs</a>
        <form action="/web/logout" method="post" class="inline">
          <button class="hover:text-zinc-900">logout</button>
        </form>
      </nav>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
